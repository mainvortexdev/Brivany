<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vetsa Workspace</title><style>
:root{--ink:#12150f;--paper:#f2f0e8;--card:#fffef8;--line:#d4d2c7;--acid:#c8ff4d;--green:#214d2f;--muted:#686c61;--danger:#9d2d24}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:"Avenir Next","Segoe UI",sans-serif}.page{min-height:100vh;display:grid;grid-template-columns:1.08fr .92fr}.art{padding:clamp(32px,6vw,86px);background:var(--ink);color:var(--paper);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.art:after{content:"V";position:absolute;right:-.13em;bottom:-.43em;font:900 min(78vw,820px)/1 Georgia,serif;color:rgba(200,255,77,.09)}.brand{font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:.78rem}.eyebrow{display:inline-flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:800}.eyebrow:before{content:"";width:24px;height:2px;background:var(--acid)}h1{font:500 clamp(3.4rem,7vw,7.5rem)/.88 Georgia,serif;letter-spacing:-.055em;max-width:850px;margin:.2em 0}.art p{max-width:480px;color:#bdc3b4;font-size:1.05rem;line-height:1.6}.panel{display:grid;place-items:center;padding:32px}.card{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:38px;box-shadow:0 18px 55px rgba(21,27,16,.09)}.card h2{font:600 2rem/1.05 Georgia,serif;margin:8px 0 12px}.card p{color:var(--muted);line-height:1.55;margin:0 0 28px}label{display:block;font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 8px}.input{width:100%;border:1px solid var(--line);background:#fff;padding:14px 15px;border-radius:11px;color:var(--ink);outline:none}.input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(33,77,47,.12)}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px 17px;font-weight:800;width:100%;margin-top:18px;background:var(--ink);color:white}button:hover{background:var(--green)}.secondary{background:transparent;border:1px solid var(--line);color:var(--ink);margin-top:9px}.error{min-height:22px;color:var(--danger);font-size:.86rem;margin-top:12px}.hidden{display:none!important}@media(max-width:900px){.page{grid-template-columns:1fr}.art{min-height:38vh}h1{font-size:3.3rem}}
</style></head><body><main class="page"><section class="art"><div class="brand">Vetsa Workspace</div><div><span class="eyebrow">Área reservada</span><h1>Tu espacio,<br>en orden.</h1><p>Un entorno privado para trabajar con tus herramientas conectadas.</p></div><small>Acceso verificado</small></section><section class="panel"><form id="auth" class="card"><span class="eyebrow">Acceso</span><h2 id="title">Confirma tu acceso.</h2><p id="copy">Introduce la dirección autorizada para continuar.</p><div id="emailStep"><label for="email">Correo</label><input id="email" class="input" type="email" autocomplete="off" autocapitalize="none" spellcheck="false" required><button type="submit">Continuar</button></div><div id="codeStep" class="hidden"><label for="code">Código</label><input id="code" class="input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required><button type="submit">Verificar</button><button id="back" class="secondary" type="button">Volver</button></div><div id="error" class="error" role="alert"></div></form></section></main><script src="/software-login.js" defer></script></body></html>
