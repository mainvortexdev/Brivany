<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetsa Secure Login</title>
    <style>
        :root {
            --bg-body: #030712;
            --bg-card: #111827;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #1f2937;
            --error: #ef4444;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--bg-card);
            padding: 2.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
            border-radius: 12px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: #1f2937;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 0.5rem;
            border-radius: 0.5rem;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #4b5563;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <img src="https://app.vetsa.es/logo-dark.png" alt="Vetsa" class="brand-logo"
            onerror="this.style.display='none'">
        <h1>Acceso Seguro</h1>
        <p>Introduce tus credenciales de Vetsa Intelligence para acceder a tu sitio web.</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required placeholder="usuario@vetsa.site">
            </div>
            <div class="form-group">
                <label>PIN de Seguridad</label>
                <input type="password" id="pin" required placeholder="****" maxlength="8">
            </div>

            <button type="submit" class="btn" id="submitBtn">Iniciar Sesión</button>
            <div id="errorMsg" class="error-msg"></div>
        </form>

        <div class="footer">
            Powered by Vetsa Intelligence Security
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN ---
        // CORREGIDO: Usamos ruta relativa para que apunte al mismo servidor
        const API_URL = "/api/web/auth/login";

        // Obtener parámetros de URL
        const urlParams = new URLSearchParams(window.location.search);
        const returnUrl = urlParams.get('return');
        const webId = urlParams.get('webId');

        // Si no hay parámetros, es un acceso directo (no permitido o redirigir a dashboard)
        if (!returnUrl || !webId) {
            document.body.innerHTML = `
                <div style="text-align:center; color:#fff;">
                    <h1>Portal de Acceso Vetsa</h1>
                    <p>Este portal es para redirección segura. Por favor, accede desde tu web personal.</p>
                </div>
            `;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const pin = document.getElementById('pin').value;
            const btn = document.getElementById('submitBtn');
            const errorDiv = document.getElementById('errorMsg');

            // Reset UI
            btn.disabled = true;
            btn.innerText = "Verificando...";
            errorDiv.style.display = 'none';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ webId, email, pin })
                });

                const data = await response.json();

                if (data.success) {
                    btn.innerText = "¡Acceso Concedido!";
                    btn.style.background = "#10b981";

                    // Construir URL de retorno con el token
                    let target = decodeURIComponent(returnUrl);

                    // Añadimos el parámetro de sesión
                    const separator = target.includes('?') ? '&' : '?';
                    const finalLink = `${target}${separator}v_token=${encodeURIComponent(JSON.stringify(data.session))}`;

                    // Redirigir
                    window.location.href = finalLink;

                } else {
                    throw new Error(data.error || "Credenciales inválidas");
                }

            } catch (err) {
                console.error(err);
                errorDiv.innerText = "Error: " + err.message;
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "Iniciar Sesión";
            }
        });
    </script>
</body>

</html>
