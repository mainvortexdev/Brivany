<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lienzo · Brivany</title><link rel="stylesheet" href="/desktop-shell/canvas.css"><script src="/desktop-shell/canvas-core.js" defer></script><script src="/desktop-shell/canvas.js" defer></script><link rel="stylesheet" href="/typography.css"></head><body>
<svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-pen" viewBox="0 0 24 24"><path d="m4 16-1 5 5-1L20 8l-4-4ZM14 6l4 4M4 16l4 4"/></symbol>
<symbol id="i-marker" viewBox="0 0 24 24"><path d="m8 13 8-9 5 5-9 8-4-4Zm0 0-3 3 3 3 4-2M4 20h9"/></symbol>
<symbol id="i-eraser" viewBox="0 0 24 24"><path d="m4 13 9-9a2 2 0 0 1 3 0l5 5a2 2 0 0 1 0 3l-9 9H8l-4-4a3 3 0 0 1 0-4Zm4-4 9 9M12 21h9"/></symbol>
<symbol id="i-line" viewBox="0 0 24 24"><path d="m5 19 14-14"/><circle cx="5" cy="19" r="1"/><circle cx="19" cy="5" r="1"/></symbol>
<symbol id="i-rect" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></symbol>
<symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></symbol>
<symbol id="i-width" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/><path d="M4 19h16" stroke-width="3"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="m8 5-5 5 5 5M3 10h10a7 7 0 0 1 7 7v2"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="m16 5 5 5-5 5m5-5H11a7 7 0 0 0-7 7v2"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol>
<symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol><symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
</defs></svg>
<header class="window-bar"><span class="window-drag pywebview-drag-region">Lienzo</span><div class="window-controls"><button id="window-min" aria-label="Minimizar" title="Minimizar"><svg><use href="#i-minus"/></svg></button><button id="window-max" aria-label="Maximizar" title="Maximizar"><svg><use href="#i-max"/></svg></button><button id="window-close" aria-label="Cerrar lienzo" title="Cerrar"><svg><use href="#i-close"/></svg></button></div></header>
<main id="viewport" aria-label="Área de dibujo"><div id="board"><canvas id="drawing" width="1600" height="1000" aria-label="Dibujo" tabindex="0"></canvas><canvas id="preview" width="1600" height="1000" aria-hidden="true"></canvas></div></main>
<div id="toolbar" role="toolbar" aria-label="Herramientas de dibujo">
<div class="tool-group" role="group" aria-label="Dibujar"><button data-tool="pen" aria-label="Lápiz" title="Lápiz · P" aria-pressed="true"><svg><use href="#i-pen"/></svg></button><button data-tool="marker" aria-label="Marcador" title="Marcador · M" aria-pressed="false"><svg><use href="#i-marker"/></svg></button><button data-tool="eraser" aria-label="Borrador" title="Borrador · E" aria-pressed="false"><svg><use href="#i-eraser"/></svg></button><button data-tool="line" aria-label="Línea" title="Línea · L" aria-pressed="false"><svg><use href="#i-line"/></svg></button><button data-tool="rect" aria-label="Rectángulo" title="Rectángulo · R" aria-pressed="false"><svg><use href="#i-rect"/></svg></button><button data-tool="ellipse" aria-label="Elipse" title="Elipse · O" aria-pressed="false"><svg><use href="#i-ellipse"/></svg></button></div>
<span class="separator"></span><button id="color-button" class="color-button" popovertarget="color-popover" aria-label="Color" title="Color"><span id="color-swatch"></span></button><button id="width-button" popovertarget="width-popover" aria-label="Grosor y relleno" title="Grosor"><svg><use href="#i-width"/></svg></button>
<span class="separator"></span><button id="undo" aria-label="Deshacer" title="Deshacer · Ctrl+Z" disabled><svg><use href="#i-undo"/></svg></button><button id="redo" aria-label="Rehacer" title="Rehacer · Ctrl+Shift+Z" disabled><svg><use href="#i-redo"/></svg></button>
<span class="separator"></span><button id="copy" aria-label="Copiar PNG" title="Copiar PNG · Ctrl+C"><svg><use href="#i-copy"/></svg></button><button id="export" aria-label="Exportar PNG" title="Exportar PNG · Ctrl+S"><svg><use href="#i-export"/></svg></button><button id="more-button" popovertarget="more-popover" aria-label="Más opciones" title="Más opciones"><svg><use href="#i-more"/></svg></button>
</div>
<div id="color-popover" class="popover" popover aria-label="Color"><div id="colors"></div><label class="custom-color">Elegir color<input id="custom-color" type="color" value="#1d1d1f" aria-label="Elegir color"></label></div>
<div id="width-popover" class="popover" popover aria-label="Grosor"><label class="width-label">Grosor<output id="width-value">4</output></label><input id="width" type="range" min="1" max="64" value="4" aria-label="Grosor del trazo"><label class="fill-label"><input id="fill" type="checkbox">Rellenar figuras</label></div>
<div id="more-popover" class="popover more-menu" popover><button id="fit">Ajustar a la ventana</button><button id="size-button">Tamaño del lienzo</button><button id="clear">Limpiar lienzo</button><button id="new">Nuevo lienzo</button></div>
<dialog id="size-dialog"><form method="dialog" id="size-form"><div class="size-fields"><label>Ancho<input id="canvas-width" type="number" min="256" max="4096" value="1600" required></label><span>×</span><label>Alto<input id="canvas-height" type="number" min="256" max="4096" value="1000" required></label></div><p id="size-error" role="status"></p><div class="dialog-actions"><button value="cancel" type="button" id="size-cancel">Cancelar</button><button value="apply" class="primary">Aplicar</button></div></form></dialog>
<dialog id="close-dialog"><p id="close-question">¿Guardar el dibujo antes de cerrar?</p><div class="dialog-actions"><button id="discard">Descartar</button><button id="close-cancel">Cancelar</button><button id="save-close" class="primary">Guardar PNG</button></div></dialog>
<p id="toast" role="status" hidden></p>
</body></html>
