<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Melodi · Brivany</title>
<link rel="stylesheet" href="/desktop-shell/character.css">
<link rel="stylesheet" href="/desktop-shell/chat.css"><script src="/desktop-shell/preferences.js" defer></script><script src="/context-engine.js" defer></script><script src="/live-voice.js" defer></script><script src="/voice-engine.js" defer></script><script src="/live-turns.js" defer></script><script src="/desktop-shell/research-citations.js" defer></script><script src="/desktop-shell/chat-activity.js" defer></script><script src="/desktop-shell/chat-scroll.js" defer></script><script src="/desktop-shell/chat-text.js" defer></script><script src="/desktop-shell/chat-media.js" defer></script><script src="/desktop-shell/chat.js" defer></script><link rel="stylesheet" href="/desktop-shell/chat-activity.css"><link rel="stylesheet" href="/typography.css"></head>
<body class="chat-clean"><main class="melodi-chat">
 <section class="chat-conversation" aria-label="Conversación con Melodi">
  <section id="chat-voice-stage" class="chat-voice-stage" aria-label="Voz con Melodi" hidden>
   <div class="chat-voice-portrait" aria-hidden="true">
    <div class="chat-voice-rings"><i></i><i></i><i></i></div>
    <div class="chat-voice-character"><span class="face melodi-character"><span class="mascot-shadow"></span><span class="mascot-hand left"></span><span class="mascot-hand right"></span><span class="mascot-body"><span class="mascot-look"><i class="eye"></i><i class="eye"></i></span><i class="mascot-cheek left"></i><i class="mascot-cheek right"></i></span></span></div>
   </div>
   <h1>Melodi</h1><p id="chat-voice-label" class="chat-voice-label" role="status">Conectando…</p>
   <p id="chat-voice-hint" class="chat-voice-hint">Un momento, estoy preparando la voz.</p>
   <div class="chat-voice-actions"><button id="chat-voice-retry" type="button" hidden>Volver a intentar</button><button id="chat-voice-close" type="button">Cancelar conexión</button></div>
  </section>
  <div id="chat-messages" class="chat-messages" role="log" aria-label="Mensajes de la conversación" aria-live="polite"><div class="chat-welcome"><h1>¿Qué creamos hoy?</h1></div></div>
  <button id="chat-latest" class="chat-latest" type="button" aria-label="Volver al último mensaje" title="Volver al último mensaje" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg></button>
  <div class="chat-bottom"><p id="chat-state" class="chat-state" role="status"></p><p id="interim" class="chat-interim" aria-live="polite"></p>
   <form id="chat-composer" class="chat-composer" inert><div id="chat-images"></div><label class="sr-only" for="chat-message">Mensaje para Melodi</label><textarea id="chat-message" rows="1" maxlength="1200" placeholder="Habla con Melodi…"></textarea>
    <div class="chat-composer-footer"><div class="chat-attachments"><button id="chat-attach-toggle" type="button" class="chat-icon" aria-label="Añadir adjuntos" aria-expanded="false" aria-controls="chat-attach-anchor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><div id="chat-attach-anchor" hidden></div></div><div class="chat-input-actions"><button id="stop-tasks" type="button" class="chat-icon danger" aria-label="Detener tareas" hidden data-icon="stop"></button><button id="interrupt" type="button" class="chat-icon" aria-label="Interrumpir respuesta" hidden data-icon="stop"></button><button id="dictation-toggle" type="button" class="chat-icon chat-dictation" aria-label="Dictar mensaje" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3"/></svg></button><button id="mic-toggle" type="button" class="chat-live" aria-label="Iniciar voz live" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4M9 6v12M13 3v18M17 7v10M21 10v4"/></svg></button><button id="chat-send" class="chat-send" type="submit" aria-label="Enviar mensaje" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19 0-14M6 11l6-6 6 6"/></svg></button></div></div>
   </form>
  </div>
 </section>
 <aside id="agent-drawer" class="chat-result" aria-label="Resultado del agente" hidden><div id="computer-mount"></div></aside>
</main></body></html>
