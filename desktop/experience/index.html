<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brivany</title><link rel="stylesheet" href="/desktop-shell/minimal.css"><link rel="stylesheet" href="/desktop-shell/references.css"><script src="/desktop-shell/icons.js" defer></script><script src="/desktop-shell/preferences.js" defer></script><script src="/desktop-shell/shell.js" defer></script><link rel="stylesheet" href="/desktop-shell/file-approvals.css"><script src="/desktop-shell/file-approvals.js" defer></script><script src="/desktop-shell/agents.js" defer></script><link rel="stylesheet" href="/typography.css"></head><body>
<div class="app-shell">
 <header class="window-bar"><div class="window-drag pywebview-drag-region"></div><div class="window-controls"><button id="window-minimize" type="button" class="window-control" aria-label="Minimizar" data-icon="minimize"></button><button id="window-maximize" type="button" class="window-control" aria-label="Maximizar" data-icon="maximize"></button><button id="window-close" type="button" class="window-control close-control" aria-label="Cerrar" data-icon="close"></button></div></header>
 <aside class="sidebar" aria-label="Menú principal"><div class="brand-row"><button class="brand-mark" type="button" aria-label="Inicio de Brivany"><img class="brand-icon" src="/icon.svg" alt=""><strong>brivany<span class="brand-dot">.</span></strong></button><button id="sidebar-toggle" class="subtle-icon" type="button" aria-label="Contraer menú" data-icon="panelLeft"></button></div>
 <nav class="module-list">
 <button class="module-link active" data-route="/app" type="button" aria-label="Melodi"><svg viewBox="0 0 24 24"><path d="M8 7h8a4 4 0 0 1 4 4v3a4 4 0 0 1-4 4H9l-5 3v-7a7 7 0 0 1 4-7Z"/></svg><span>Melodi</span></button>
 <button class="module-link" data-route="/spaces" type="button" aria-label="Espacios"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 5v10l9 5 9-5V8M12 13v10"/></svg><span>Espacios</span></button>
 <button class="module-link" data-route="/human-skills" type="button" aria-label="Human-skills"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M6 6l12 12M18 6 6 18"/></svg><span>Human-skills</span></button>
 <button class="module-link" data-route="/practice" type="button" aria-label="Práctica"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="13" rx="2"/><path d="M8 21h8M12 17v4m-4-11 3 3 5-6"/></svg><span>Práctica</span></button>
 <button class="module-link" data-route="/dubbing" type="button" aria-label="Video y traducción"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3Z"/></svg><span>Video y traducción</span></button>
 <button class="module-link" data-route="/sous" type="button" aria-label="Sous"><svg viewBox="0 0 24 24"><path d="M7 15v6h10v-6a5 5 0 0 0 2-9 5 5 0 0 0-9-2 4 4 0 0 0-5 6 5 5 0 0 0 2 5Z"/></svg><span>Sous</span></button>
 <div class="nav-space"></div>
 <button class="module-link" data-route="/connections" type="button" aria-label="Conexiones"><svg viewBox="0 0 24 24"><path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0V8Zm6 9v5"/></svg><span>Conexiones</span></button>
 <button class="module-link" data-route="/activity" type="button" aria-label="Bitácora"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Bitácora</span></button>
 </nav><button class="module-link settings-link" data-settings type="button" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 3 1 4 4 1 2 2 4-2 3-1 1-4 2-3-2-4-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg><span>Ajustes</span></button></aside>
 <main class="workspace"><header class="topbar"><span id="page-title">Melodi</span><div class="topbar-actions"><button id="new-session" class="subtle-icon new-chat" type="button" aria-label="Nueva conversación" data-icon="compose"></button></div></header><section class="module-view" id="module-view"><iframe id="module-frame" allow="microphone; camera; autoplay"></iframe></section></main>
</div>
<dialog id="app-settings" aria-label="Ajustes de Brivany"><button id="settings-close" class="settings-close" type="button" aria-label="Cerrar ajustes" data-icon="close"></button><iframe id="settings-frame"></iframe></dialog><div id="toast" class="toast" role="status" hidden></div>
</body></html>
